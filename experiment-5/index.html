<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <section class="search-area">

            <form id="weatherForm" class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search a city..."
                    autocomplete="off"
                    aria-label="Enter city name"
                >

                <button type="submit">
                    Search
                </button>

            </form>


            <div class="quick-searches">

                <button type="button" class="quick-city" data-city="Delhi">
                    Delhi
                </button>

                <button type="button" class="quick-city" data-city="Mumbai">
                    Mumbai
                </button>

                <button type="button" class="quick-city" data-city="Bengaluru">
                    Bengaluru
                </button>

                <button type="button" class="quick-city" data-city="Bhubaneswar">
                    Bhubaneswar
                </button>

            </div>

        </section>


        <section id="weatherResult" class="weather-card">

            <div class="weather-top">

                <div>

                    <p class="location-label">
                        CURRENT WEATHER
                    </p>

                    <h1 id="location">
                        Search for a city
                    </h1>

                    <p id="condition">
                        Enter a city to see its weather
                    </p>

                </div>

                <div
                    id="weatherIcon"
                    class="weather-icon"
                    aria-hidden="true"
                >
                    ☁
                </div>

            </div>


            <div class="main-weather">

                <div class="temperature">
                    <span id="temperature">--</span>
                    <sup>°C</sup>
                </div>

                <p id="feelsLike">
                    Feels like --°C
                </p>

            </div>


            <div class="weather-info">

                <article class="info-box">

                    <span>Humidity</span>

                    <strong id="humidity">
                        --%
                    </strong>

                </article>


                <article class="info-box">

                    <span>Wind</span>

                    <strong id="wind">
                        -- km/h
                    </strong>

                </article>


                <article class="info-box">

                    <span>Precipitation</span>

                    <strong id="precipitation">
                        -- mm
                    </strong>

                </article>

            </div>


            <section class="forecast-section">

                <div class="forecast-heading">

                    <h2>
                        7-Day Forecast
                    </h2>

                    <span id="forecastHint">
                        Daily outlook
                    </span>

                </div>


                <div
                    id="forecast"
                    class="forecast"
                ></div>

            </section>


            <p
                id="statusMessage"
                class="status-message"
                aria-live="polite"
            >
                Ready
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
