<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="top">
            <div>
                <h1>My To-Do List</h1>
                <p id="taskCount">0 tasks</p>
            </div>
        </div>
        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button type="submit" id="addButton">Add Task</button>
        </form>
        <div class="task-options">
            <button type="button" id="clearCompleted">Clear completed</button>
        </div>
        <ul id="taskList"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task above.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
